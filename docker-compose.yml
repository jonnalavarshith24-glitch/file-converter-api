services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis-data:/data

  api:
    build: .
    command: node src/server.js
    ports:
      - "3000:3000"
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
    volumes:
      - storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: node src/worker.js
    environment:
      REDIS_URL: redis://redis:6379
      STORAGE_DIR: /app/storage
      WORKER_CONCURRENCY: "4"
    volumes:
      - storage:/app/storage
    depends_on:
      - redis
    restart: unless-stopped

volumes:
  redis-data:
  storage:
